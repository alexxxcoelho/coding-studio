[package]
name = "cs-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coding-studio"
path = "src/main.rs"

[dependencies]
coding-studio-final-export = { path = "../cs-reviewer-export" }
sha2_010 = { package = "sha2", version = "0.10.9" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
url = "2"
cs-model.workspace = true
cs-ingest.workspace = true
cs-store.workspace = true
cs-ai.workspace = true
cs-lex.workspace = true
cs-qdpx.workspace = true
anyhow.workspace = true
regex.workspace = true
ureq = { version = "3", features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
clap.workspace = true
open.workspace = true
include_dir.workspace = true
mime_guess.workspace = true
zip.workspace = true
rusqlite.workspace = true
