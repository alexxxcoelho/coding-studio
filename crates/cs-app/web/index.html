<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%231e5a8c' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2.5' fill='%231e5a8c'/%3E%3C/svg%3E">
  <script>
    // Theme before first paint: a saved choice, otherwise the system setting.
    try {
      const t = localStorage.getItem('cs-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/library">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Coding Studio</span>
    </a>
    <nav class="mainnav" aria-label="Main">
      <a href="#/library" data-nav="library">Interviews</a>
      <a href="#/codebook" data-nav="codebook">Codebook</a>
      <a href="#/audit" data-nav="audit">Audit trail</a>
    </nav>
    <div class="topbar-status" id="chain-status" aria-live="polite"></div>
    <div class="theme-switch" id="theme-switch" role="group" aria-label="Theme"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
