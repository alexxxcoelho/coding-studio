[package]
name = "cs-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coding Studio desktop app: the local server inside a native window"

[[bin]]
name = "coding-studio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
cs-app.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
open.workspace = true
# macos-private-api: needed for a transparent window, which the sidebar vibrancy shows through.
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-window-state.workspace = true
# A second launch focuses the running window instead of opening a second database.
tauri-plugin-single-instance.workspace = true

# Sidebar material of the macOS window (Liquid Glass look); other platforms keep an opaque window.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
