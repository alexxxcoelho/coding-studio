[workspace]
resolver = "2"
members = ["crates/cs-reviewer-export", "crates/cs-model", "crates/cs-ingest", "crates/cs-store", "crates/cs-ai", "crates/cs-lex", "crates/cs-qdpx", "crates/cs-app", "crates/cs-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alexandre Dos Santos Coelho"]

[workspace.dependencies]
cs-model = { path = "crates/cs-model" }
cs-ingest = { path = "crates/cs-ingest" }
cs-store = { path = "crates/cs-store" }
cs-ai = { path = "crates/cs-ai" }
cs-lex = { path = "crates/cs-lex" }
cs-qdpx = { path = "crates/cs-qdpx" }
cs-app = { path = "crates/cs-app" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
open = "5"
tempfile = "3"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
include_dir = "0.7"
mime_guess = "2"
uuid = { version = "1", default-features = false, features = ["v5"] }
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
similar = "2"
